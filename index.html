<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home esercitazioni</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="home-page">
  <header>
    <div class="header-content">
      <h1>Esercitazioni</h1>
      <p>
        Seleziona una sezione per visualizzare automaticamente le pagine HTML disponibili nel repository.
      </p>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="topbar">
        <div>
          <strong>Home page del corso</strong>
          <div class="status" id="statusText">Caricamento sezioni...</div>
        </div>
        <button class="secondary" id="reloadButton" type="button">Ricarica</button>
      </div>
      <div class="section-buttons" id="quickButtons"></div>
    </section>

    <section class="content-grid">
      <aside class="sidebar">
        <h2>Sezioni</h2>
        <div class="section-list" id="sectionList"></div>
      </aside>

      <section class="content">
        <h2 id="currentSectionTitle">Seleziona una sezione</h2>
        <div class="route-list" id="routeList">
          <div class="empty">Scegli una sezione per vedere le pagine disponibili.</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const sections = [
      {
        label: "Lezioni",
        path: "lezioni"
      },
      {
        label: "Web",
        path: "web"
      },
      {
        label: "C++",
        path: "C++"
      }
    ];

    const repository = {
      owner: "",
      name: "",
      branch: "main"
    };

    const localRoutes = {
      lezioni: [
        {
          title: "Rappresentazione numeri interi",
          path: "lezioni/rappresentazione-interi.html",
          url: "lezioni/rappresentazione-interi.html"
        }
      ],
      web: [
        {
          title: "Esercizi html+js manipolazione DOM e BOM",
          path: "web/esercizi-html-js-dom-bom.html",
          url: "web/esercizi-html-js-dom-bom.html"
        }
      ],
      "C++": [
        {
          title: "Esercizi C++ base",
          path: "C++/esercizi-cpp-base-0.html",
          url: "C++/esercizi-cpp-base-0.html"
        },
        {
          title: "Esercizi C++ tipi di dato, char e ASCII",
          path: "C++/esercizi-cpp-tipi-char-ascii.html",
          url: "C++/esercizi-cpp-tipi-char-ascii.html"
        },
        {
          title: "Esercizi C++ if else e condizioni logiche",
          path: "C++/esercizi-cpp-if-else-condizioni.html",
          url: "C++/esercizi-cpp-if-else-condizioni.html"
        },
        {
          title: "Esercizi C++ while base",
          path: "C++/esercizi-cpp-while-base.html",
          url: "C++/esercizi-cpp-while-base.html"
        },
        {
          title: "Esercizi C++ do while base",
          path: "C++/esercizi-cpp-do-while-base.html",
          url: "C++/esercizi-cpp-do-while-base.html"
        },
        {
          title: "Esercizi C++ ciclo for base",
          path: "C++/esercizi-cpp-for-base.html",
          url: "C++/esercizi-cpp-for-base.html"
        },
        {
          title: "Esercizi C++ cicli e if else",
          path: "C++/esercizi-cpp-cicli-if-else.html",
          url: "C++/esercizi-cpp-cicli-if-else.html"
        },
        {
          title: "Esercizi C++ riepilogo prima parte",
          path: "C++/esercizi-cpp-riepilogo-prima-parte.html",
          url: "C++/esercizi-cpp-riepilogo-prima-parte.html"
        },
        {
          title: "Esercizi C++ puntatori base",
          path: "C++/esercizi-puntatori-base-0.html",
          url: "C++/esercizi-puntatori-base-0.html"
        }
      ]
    };

    const statusText = document.getElementById("statusText");
    const quickButtons = document.getElementById("quickButtons");
    const sectionList = document.getElementById("sectionList");
    const routeList = document.getElementById("routeList");
    const currentSectionTitle = document.getElementById("currentSectionTitle");
    const reloadButton = document.getElementById("reloadButton");

    let sectionData = [];

    const inferRepositoryFromGithubPages = () => {
      const hostname = window.location.hostname;
      const pathnameParts = window.location.pathname.split("/").filter(Boolean);

      if (!hostname.endsWith("github.io")) {
        return null;
      }

      const owner = hostname.replace(".github.io", "");
      const name = pathnameParts.length > 0 ? pathnameParts[0] : `${owner}.github.io`;

      return { owner, name };
    };

    const getRepository = () => {
      if (repository.owner && repository.name) {
        return repository;
      }

      const inferred = inferRepositoryFromGithubPages();
      if (!inferred) {
        return null;
      }

      return {
        owner: inferred.owner,
        name: inferred.name,
        branch: repository.branch
      };
    };

    const encodePathForApi = (path) => {
      return path
        .split("/")
        .map((part) => encodeURIComponent(part))
        .join("/");
    };

    const createElement = (tagName, className, text) => {
      const element = document.createElement(tagName);
      if (className) {
        element.className = className;
      }
      if (text !== undefined) {
        element.innerText = text;
      }
      return element;
    };

    const clearElement = (element) => {
      while (element.firstChild) {
        element.removeChild(element.firstChild);
      }
    };

    const getHtmlTitle = async (path) => {
      try {
        const response = await fetch(encodeURI(path), { cache: "no-store" });
        if (!response.ok) {
          return null;
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const title = doc.querySelector("title");

        if (!title || !title.innerText.trim()) {
          return null;
        }

        return title.innerText.trim();
      } catch (error) {
        return null;
      }
    };

    const filenameToTitle = (filename) => {
      return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    };

    const loadSectionFiles = async (section) => {
      const repo = getRepository();

      if (!repo) {
        throw new Error("Repository non rilevato. Pubblica la pagina su GitHub Pages oppure compila owner e name nella costante repository.");
      }

      const apiPath = encodePathForApi(section.path);
      const url = `https://api.github.com/repos/${repo.owner}/${repo.name}/contents/${apiPath}?ref=${repo.branch}`;
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`Impossibile leggere la cartella ${section.path}. Verifica che esista nel repository e che il branch sia corretto.`);
      }

      const files = await response.json();

      if (!Array.isArray(files)) {
        return [];
      }

      const htmlFiles = files
        .filter((file) => file.type === "file")
        .filter((file) => file.name.toLowerCase().endsWith(".html"))
        .filter((file) => file.name.toLowerCase() !== "index.html")
        .sort((a, b) => a.name.localeCompare(b.name));

      const routes = await Promise.all(
        htmlFiles.map(async (file) => {
          const title = await getHtmlTitle(file.path);
          return {
            title: title || filenameToTitle(file.name),
            path: file.path,
            url: encodeURI(file.path)
          };
        })
      );

      return routes;
    };

    const renderSections = () => {
      clearElement(sectionList);
      clearElement(quickButtons);

      sectionData.forEach((section, index) => {
        const sidebarButton = createElement("button", "section-link", "");
        sidebarButton.type = "button";

        const label = createElement("span", "", section.label);
        const badge = createElement("span", "badge", String(section.routes.length));

        sidebarButton.appendChild(label);
        sidebarButton.appendChild(badge);
        sidebarButton.onclick = () => renderRoutes(index);

        const quickButton = createElement("button", "secondary", section.label);
        quickButton.type = "button";
        quickButton.onclick = () => renderRoutes(index);

        sectionList.appendChild(sidebarButton);
        quickButtons.appendChild(quickButton);
      });
    };

    const renderRoutes = (sectionIndex) => {
      const section = sectionData[sectionIndex];
      currentSectionTitle.innerText = section.label;
      clearElement(routeList);

      if (section.error) {
        const error = createElement("div", "error", section.error);
        routeList.appendChild(error);
        return;
      }

      if (section.routes.length === 0) {
        const empty = createElement("div", "empty", `Nessun file HTML trovato nella cartella ${section.path}.`);
        routeList.appendChild(empty);
        return;
      }

      section.routes.forEach((route) => {
        const link = document.createElement("a");
        link.className = "route-card";
        link.href = route.url;

        const title = createElement("div", "route-title", route.title);
        const path = createElement("div", "route-path", route.path);

        link.appendChild(title);
        link.appendChild(path);
        routeList.appendChild(link);
      });
    };

    const loadAllSections = async () => {
      statusText.innerText = "Caricamento sezioni...";
      currentSectionTitle.innerText = "Seleziona una sezione";
      clearElement(routeList);
      routeList.appendChild(createElement("div", "empty", "Caricamento in corso..."));

      const loaded = [];

      for (const section of sections) {
        try {
          const routes = await loadSectionFiles(section);
          loaded.push({
            ...section,
            routes,
            error: null
          });
        } catch (error) {
          const routes = localRoutes[section.path] || [];
          loaded.push({
            ...section,
            routes,
            error: routes.length > 0 ? null : error.message
          });
        }
      }

      sectionData = loaded;
      renderSections();

      const totalRoutes = sectionData.reduce((total, section) => total + section.routes.length, 0);
      statusText.innerText = `Sezioni caricate: ${sectionData.length}. Pagine trovate: ${totalRoutes}.`;

      if (sectionData.length > 0) {
        renderRoutes(0);
      }
    };

    reloadButton.onclick = loadAllSections;

    loadAllSections();
  </script>
</body>
</html>
