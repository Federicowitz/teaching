<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>7. Modificare un testo con il DOM</title>
</head>
<body>
  <h1 id="title">Titolo iniziale</h1>

  <script>
    const title = document.getElementById("title");

    title.innerText = "Titolo modificato con JavaScript";
  </script>
</body>
</html>
