<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>14. Timer con setTimeout</title>
</head>
<body>
  <h1>Timer</h1>

  <button id="button" type="button">Avvia timer</button>
  <p id="message"></p>

  <script>
    const button = document.getElementById("button");
    const message = document.getElementById("message");

    button.onclick = () => {
      message.innerText = "Attendi...";

      setTimeout(() => {
        message.innerText = "Sono passati tre secondi.";
      }, 3000);
    };
  </script>
</body>
</html>
